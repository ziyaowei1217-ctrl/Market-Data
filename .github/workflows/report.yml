name: report

# Weekly issue: after Saturday's scheduled warehouse run succeeds, draw 市场一周 from the
# warehouse and upload it to the private Storage bucket "reports" (readers only).
# Secrets (Settings → Secrets and variables → Actions):
#   WAREHOUSE_DB_URL     Supabase session-pooler connection string (required, shared with warehouse)
#   SUPABASE_SECRET_KEY  Supabase → Settings → API Keys → secret key (sb_secret_…); without it the
#                        issue is built and checked but not uploaded
# This repository is public: never upload the issue as a workflow artifact, and never print data
# values to the log. Issues contain licensed data (MSCI) that is for the reader list only.
# workflow_run only fires from the default branch's copy of this file.

on:
  workflow_run:
    workflows: [warehouse]
    types: [completed]
  workflow_dispatch:
    inputs:
      week:
        description: "Friday cutoff YYYY-MM-DD; empty = the latest Friday"
        default: ""

concurrency:
  group: report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  issue:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WAREHOUSE_DB_URL: ${{ secrets.WAREHOUSE_DB_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Same rule as the warehouse workflow: always run the warehouse branch's code.
          ref: warehouse
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/report/requirements.txt
            pipeline/warehouse/requirements.txt
      - run: pip install -r pipeline/report/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s pipeline/report/tests -t .
      - name: Check secrets
        run: |
          if [ -z "$WAREHOUSE_DB_URL" ]; then
            echo "::error::WAREHOUSE_DB_URL secret is not set"; exit 1
          fi
      - name: Build issue
        env:
          WEEK: ${{ github.event.inputs.week }}
        run: |
          set -euo pipefail
          args=(--output-dir outputs/weekly)
          if [ -n "${WEEK:-}" ]; then args+=(--week "$WEEK"); fi
          python -m pipeline.report build "${args[@]}" | tee build.log
          {
            echo "### 市场一周"
            sed 's/^/- /' build.log
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to Storage
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::warning::SUPABASE_SECRET_KEY is not set; the issue was built but not uploaded"
            exit 0
          fi
          python -m pipeline.report publish outputs/weekly | tee -a "$GITHUB_STEP_SUMMARY"
