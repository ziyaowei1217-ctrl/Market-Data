name: warehouse-mcp

# Offline tests for the Edge Functions: the read-only MCP server (warehouse-mcp) and the
# weekly issue's upload-link function (report-upload).
# Deploying is manual: supabase functions deploy <name> --no-verify-jwt

on:
  push:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/warehouse-mcp.yml"
  pull_request:
    paths:
      - "supabase/functions/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --experimental-strip-types --no-warnings --test supabase/functions/warehouse-mcp/server.test.ts
      - run: node --experimental-strip-types --no-warnings --test supabase/functions/report-upload/server.test.ts
